<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NaiveSwitcher</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<link rel="stylesheet" href="/style.css?v=3.2.0">
<script>
(function(){var t=localStorage.getItem('theme');if(t==='dark')document.documentElement.classList.add('dark');else if(t==='light')document.documentElement.classList.add('light')})();
</script>
</head>
<body>
<div class="w">
    <header>
        <h1>NaiveSwitcher</h1>
        <span style="display:flex;align-items:center;gap:10px">
            <span class="tk" id="refresh-countdown">3s</span>
            <button class="thm" id="theme-btn" onclick="toggleTheme()">🌙</button>
        </span>
    </header>
    <div class="sb">
        <span id="server-status-indicator" class="d"></span>
        <span class="l">当前</span>
        <span id="current-server">加载中…</span>
    </div>
    <h2>状态</h2>
    <table>
        <tr><td>运行</td><td id="uptime">--</td></tr>
        <tr><td>自动切换</td><td id="auto-switch-status">--</td></tr>
        <tr><td>错误</td><td id="error-count">0</td></tr>
        <tr><td>更新于</td><td id="last-update">--</td></tr>
    </table>
    <h2>运行时</h2>
    <table>
        <tr><td>协程</td><td id="goroutine-count">--</td></tr>
        <tr><td>内存</td><td id="memory-usage">--</td></tr>
        <tr><td>Naive</td><td><span class="tg" id="naive-version">--</span></td></tr>
        <tr><td>Switcher</td><td><span class="tg" id="switcher-version">--</span></td></tr>
    </table>
    <h2>故障</h2>
    <pre class="st" id="down-stats">加载中…</pre>
    <div class="acts">
        <button class="b p" onclick="switchToBestServer()">切换最佳</button>
        <button class="b" id="auto-switch-btn" onclick="toggleAutoSwitch()">暂停自动</button>
        <button class="b" onclick="checkUpdates()">检查更新</button>
        <button class="b" onclick="viewLogs()">日志</button>
    </div>
    <h2>手动切换</h2>
    <div class="sr">
        <select id="server-select"><option value="">选择服务器…</option></select>
        <button class="b p" id="switch-btn" onclick="switchToSelectedServer()" disabled>切换</button>
    </div>
</div>
<div id="logs-modal" class="mo">
    <div class="mb">
        <div class="mt"><span>日志</span><button onclick="closeLogsModal()">&times;</button></div>
        <div class="ms"><div id="logs-content" class="lg">加载中…</div></div>
    </div>
</div>
<div class="tw" id="toast-container"></div>
<script src="/app.js?v=3.2.0"></script>
</body>
</html>
